name: FTP-Struktur ermitteln

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ftp-diagnose.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verzeichnisbaum des FTP-Kontos auslesen
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          {
            echo "# FTP-Struktur, erstellt $(date -u)"
            echo
            echo "## Landeverzeichnis nach dem Login"
            lftp -u "$U","$P" "$S" -e "set ssl:verify-certificate no; pwd; ls -la; bye" 2>&1 | head -40
            echo
            echo "## Inhalt von public_html (falls vorhanden)"
            lftp -u "$U","$P" "$S" -e "set ssl:verify-certificate no; cd public_html; pwd; ls -la; bye" 2>&1 | head -40
            echo
            echo "## Inhalt von domains (falls vorhanden)"
            lftp -u "$U","$P" "$S" -e "set ssl:verify-certificate no; cd domains; ls -la; bye" 2>&1 | head -30
            echo
            echo "## Wo liegt eine index.html mit ~90 KB?"
            lftp -u "$U","$P" "$S" -e "set ssl:verify-certificate no; find -d 3 / | grep -i 'index.html'; bye" 2>&1 | head -30
          } > ftp-struktur.txt 2>&1
          echo "--- Ergebnis ---"; cat ftp-struktur.txt

      - name: Ergebnis ins Repo schreiben
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ftp-struktur.txt
          git commit -m "FTP-Struktur ermittelt" || echo "keine Aenderung"
          git push
